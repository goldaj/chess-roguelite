name: Balanced branching campaign validation
on:
  push:
    branches: ["feat/gpt6-branching-campaign-20261027"]
  pull_request:
    branches: ["research/gpt6-tactical-ai-after-review-20261027"]
permissions:
  contents: read
concurrency:
  group: balanced-campaign-${{ github.ref }}
  cancel-in-progress: true
jobs:
  campaign-logic:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile
        run: python -m compileall -q src tests
      - name: Campaign, chess, shop and tactical AI regressions
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Print material and turn budget diagnostics
        run: PYTHONPATH=. python tools/campaign_balance.py
  campaign-pygame:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Real Pygame menu, shop and route transition
        run: PYTHONPATH=. python tests/smoke_pygame.py
