name: Build Windows playtest
on:
  push:
    branches: ["feat/gpt6-windows-playtest-20261028"]
  pull_request:
    branches: ["feat/gpt6-branching-campaign-20261027"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: chess-windows-playtest-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-and-smoke:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: "x64"
      - name: Install isolated Windows build dependencies
        run: python -m pip install -r requirements.txt "pyinstaller>=6.10,<7"
      - name: Run headless Python tests on Windows
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Test source playtest entry with an isolated save
        shell: pwsh
        run: |
          $env:SDL_VIDEODRIVER = "dummy"
          $env:SDL_AUDIODRIVER = "dummy"
          $env:CHESS_ROGUELITE_PLAYTEST_DATA_DIR = Join-Path $env:RUNNER_TEMP "source-playtest-save"
          python playtest_entry.py --smoke
          if ($LASTEXITCODE -ne 0) { throw "Python playtest source smoke failed" }
          if (-not (Test-Path (Join-Path $env:CHESS_ROGUELITE_PLAYTEST_DATA_DIR "save.json"))) { throw "Isolated save not created" }
          if (Test-Path "src/meta/save.json") { throw "Source test modified original save path" }
      - name: Build standalone Windows .exe and bundle game assets
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onedir --windowed --name ChessRoguelite-Playtest --add-data "assets;assets" --add-data "content;content" playtest_entry.py
          if ($LASTEXITCODE -ne 0) { throw "PyInstaller build failed" }
          if (-not (Test-Path "dist/ChessRoguelite-Playtest/ChessRoguelite-Playtest.exe")) { throw "Missing built EXE" }
          Set-Content -Path "dist/ChessRoguelite-Playtest/LIRE_AVANT_DE_JOUER.txt" -Value @(
            "CHESS ROGUELITE - VERSION EXPERIMENTALE"
            "Extraire TOUT le ZIP avant de lancer ChessRoguelite-Playtest.exe."
            "Garder le dossier _internal a cote du fichier EXE."
            "Sauvegarde independante : %LOCALAPPDATA%\ChessRoguelitePlaytest\save.json"
            "La campagne est experimentale, son equilibrage reste a valider."
            "Git commit: ${{ github.sha }}"
          )
      - name: Run the COMPILED Windows executable, not only Python source
        shell: pwsh
        run: |
          $env:SDL_VIDEODRIVER = "dummy"
          $env:SDL_AUDIODRIVER = "dummy"
          $env:CHESS_ROGUELITE_PLAYTEST_DATA_DIR = Join-Path $env:RUNNER_TEMP "compiled-playtest-save"
          $exe = Resolve-Path "dist/ChessRoguelite-Playtest/ChessRoguelite-Playtest.exe"
          $proc = Start-Process -FilePath $exe -ArgumentList "--smoke" -Wait -PassThru
          if ($proc.ExitCode -ne 0) { throw "Packaged EXE smoke failed with exit $($proc.ExitCode)" }
          if (-not (Test-Path (Join-Path $env:CHESS_ROGUELITE_PLAYTEST_DATA_DIR "save.json"))) {
            throw "Packaged EXE did not create isolated save"
          }
          if (Test-Path "src/meta/save.json") { throw "Packaged EXE modified original save path" }
      - name: Publish downloadable Windows build (30 days)
        uses: actions/upload-artifact@v4
        with:
          name: ChessRoguelite-Windows-Playtest
          path: dist/ChessRoguelite-Playtest/
          if-no-files-found: error
          retention-days: 30
