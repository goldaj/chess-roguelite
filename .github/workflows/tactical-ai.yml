name: Tactical chess roguelite regression
on:
  push:
    branches: ["research/gpt6-tactical-ai-after-review-20261027"]
  pull_request:
    branches: ["chatgpt/review-20261024"]
permissions:
  contents: read
concurrency:
  group: tactical-chess-${{ github.ref }}
  cancel-in-progress: true
jobs:
  chess-headless:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile all game modules
        run: python -m compileall -q src tests
      - name: Headless chess, shop and tactical AI tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      # Unit tests exercise real board/AI logic, without pretending a Pygame
      # window has been opened or a complete run played by a human.
