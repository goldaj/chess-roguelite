name: Chess gameplay and persistence tests
on:
  pull_request:
  push:
    branches: [develop]
permissions:
  contents: read
jobs:
  saves:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
